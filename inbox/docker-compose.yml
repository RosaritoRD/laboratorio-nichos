# Idea capture inbox.
#
# oauth2-proxy is the only thing connected to your HTTPS proxy (Nginx Proxy Manager, Caddy…),
# and the inbox lives on an `internal: true` network: no route to or from the internet.
# Without going through the Google login there's no way to reach it.
#
# Start it (from the repo root):  docker compose -f inbox/docker-compose.yml up -d --build

services:
  yt-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: yt-auth
    restart: unless-stopped
    env_file:
      - ./oauth.env                       # see inbox/oauth.env.example
    environment:
      OAUTH2_PROXY_PROVIDER: google
      # This URI must be registered in your Google Cloud OAuth client,
      # or login fails with redirect_uri_mismatch.
      OAUTH2_PROXY_REDIRECT_URL: https://yt.your-domain.com/oauth2/callback
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2/allowed-emails.txt
      OAUTH2_PROXY_UPSTREAMS: http://yt-inbox:8080
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    ports:
      - "127.0.0.1:4190:4180"      # for local diagnostics only
    volumes:
      - ./allowed-emails.txt:/etc/oauth2/allowed-emails.txt:ro
    networks:
      - yt_private
      - proxy
    depends_on:
      - yt-inbox

  yt-inbox:
    build:
      context: ..
      dockerfile: inbox/Dockerfile
    container_name: yt-inbox
    restart: unless-stopped
    # Only the project folder (notas/ and nichos/). Nothing else from the server.
    volumes:
      - ..:/proyecto
    networks:
      - yt_private          # internal: no route to the internet, no published ports

networks:
  yt_private:
    internal: true
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}   # your proxy's Docker network
